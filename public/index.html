<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AppHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap">
<style>
:root{
  --bg:#f3f4f8;--surface:#fff;--ink:#141829;--mut:#5f6680;--line:#e1e4ed;--soft:#e8eaf2;
  --btn:#141829;--btn-t:#fff;--focus:#2563eb;--danger:#b42318;
  --cd:#1d2540; /* màu nền banner, được đổi theo màu icon của từng ứng dụng */
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f121d;--surface:#171b2b;--ink:#eef0fa;--mut:#9aa1bd;--line:#272c43;--soft:#1f2437;
  --btn:#eef0fa;--btn-t:#141829;--focus:#7aa2ff;--danger:#ff8a80;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
h1,h2{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.15}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* Thanh trên cùng */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (background:color-mix(in srgb,red,blue)){.top{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}}
.top-in{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.03em}
.srch{position:relative;flex:1;max-width:520px}
.srch input{width:100%;height:46px;padding:0 18px 0 46px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.srch input::placeholder{color:var(--mut)}
.srch svg{position:absolute;left:16px;top:13px;width:20px;height:20px;color:var(--mut);pointer-events:none}

main{width:100%;max-width:1200px;margin:0 auto;padding:28px 24px 72px;flex:1}
main:empty{min-height:60vh}
footer{border-top:1px solid var(--line);color:var(--mut);font-size:14px}
footer div{max-width:1200px;margin:0 auto;padding:20px 24px}

/* Nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border:0;border-radius:999px;background:var(--btn);color:var(--btn-t);font-weight:600;white-space:nowrap;transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none}
.btn.alt{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{height:36px;padding:0 18px;font-size:14px}
.btn[disabled]{cursor:default;filter:none;transform:none}

/* Icon ứng dụng */
.ic{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22%;background:var(--soft);outline:1px solid rgba(20,24,41,.1);outline-offset:-1px}
.ph{display:grid;place-items:center;font-weight:700;font-size:26px;color:var(--mut)}

/* Banner nổi bật và đầu trang chi tiết */
.hero,.dh{background:var(--cd);color:#fff;border-radius:28px;transition:background-color .6s}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center;padding:44px}
.hero-ic,.dh-ic{width:168px;flex:none;box-shadow:0 18px 40px -14px rgba(0,0,0,.55)}
.hero h1,.dh h1{font-size:clamp(32px,5vw,56px);font-weight:800;letter-spacing:-.035em;overflow-wrap:anywhere}
.dev{margin-top:8px;font-size:17px;opacity:.85}
.hero .d{margin-top:14px;max-width:56ch;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.hero .btn:not(.alt),.dh .btn:not(.alt){background:#fff;color:#141829}
.hero .btn.alt,.dh .btn.alt{color:#fff}

/* Danh mục và danh sách */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hero+.chips{margin-top:28px}
.chip{flex:none;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500}
.chip small{margin-left:8px;font-size:13px;color:var(--mut)}
.chip[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:var(--btn-t)}
.chip[aria-pressed=true] small{color:inherit;opacity:.7}
.sec{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:36px 0 12px}
.sec h2{font-size:26px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--soft)}
.seg button{padding:7px 14px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,24,41,.18)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:4px 20px}
.row{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px;border-radius:16px;transition:background-color .15s}
.row:hover{background:var(--surface)}
.row .t{min-width:0}
.row b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b a::after{content:"";position:absolute;inset:0;border-radius:16px}
.row b a:focus-visible{outline:0}
.row b a:focus-visible::after{outline:3px solid var(--focus);outline-offset:-3px}
.row .s{display:block;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{position:relative;z-index:1;display:grid;justify-items:center;gap:4px}
.row .g small{font-size:12px;color:var(--mut)}
.none{padding:28px 0;color:var(--mut)}
.empty{max-width:560px;margin:12vh auto 0;display:grid;justify-items:center;gap:14px;text-align:center}
.empty h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-.035em}
.empty p{color:var(--mut)}
.tiles{display:flex;gap:20px;overflow-x:auto;padding-bottom:8px}
.tile{flex:none;width:112px}
.tile b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:10px;font-size:14px;font-weight:600;line-height:1.3}
.tile span{font-size:13px;color:var(--mut)}

/* Trang chi tiết */
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 14px -6px;padding:6px 12px 6px 6px;border-radius:999px;font-weight:500;color:var(--mut)}
.back:hover{background:var(--soft);color:var(--ink)}
.back svg{width:20px;height:20px}
.dh{--hp:44px;padding:44px var(--hp) 0;overflow:hidden}
.dh-top{display:flex;align-items:center;gap:36px}
.dh-ic{width:144px}
.dh .acts{margin-top:22px}
.stats{display:flex;margin:36px calc(var(--hp)*-1) 0;border-top:1px solid rgba(255,255,255,.18)}
.stats>div{flex:1;padding:18px 24px;border-left:1px solid rgba(255,255,255,.18)}
.stats>div:first-child{padding-left:var(--hp);border-left:0}
.stats b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.stats span{font-size:13px;opacity:.78}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;margin-top:40px}
.dbody h2{margin-bottom:14px;font-size:22px}
.about{max-width:68ch;font-size:16px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.steps{display:grid;gap:14px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--cd);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.info{margin:0}
.info div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.info dt{color:var(--mut)}
.info dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}


#toast{position:fixed;left:50%;bottom:24px;z-index:50;max-width:calc(100vw - 32px);padding:12px 22px;border-radius:999px;background:var(--btn);color:var(--btn-t);font-weight:500;text-align:center;opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .dbody{grid-template-columns:minmax(0,1fr);gap:40px}
}
@media (max-width:720px){
  .top-in{flex-wrap:wrap;gap:12px;padding:10px 16px}
  .srch{order:3;flex-basis:100%;max-width:none}
  main{padding:20px 16px 56px}
  footer div{padding:18px 16px}
  .hero{grid-template-columns:minmax(0,1fr);gap:22px;padding:28px 22px}
  .hero-ic{width:96px}
  .dh{--hp:22px;padding-top:28px}
  .dh-top{flex-direction:column;align-items:flex-start;gap:20px}
  .dh-ic{width:104px}
  .stats>div{padding:14px 12px}
  .stats b{font-size:18px}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .sec{flex-wrap:wrap;margin-top:28px}
  .sec h2{font-size:22px}
  .hero .acts .btn,.dh .acts .btn{flex:1 1 100%}
  .dh-top>div{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/" aria-label="AppHub, về trang chủ">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M16 8v11m0 0-4.5-4.5M16 19l4.5-4.5M9 24h14" fill="none" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    AppHub
  </a>
  <div class="srch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Tìm ứng dụng hoặc nhà phát triển" aria-label="Tìm ứng dụng" autocomplete="off">
  </div>
</div></header>
<main id="app"></main>
<footer><div>Tệp APK do quản trị viên đăng tải. Chỉ cài đặt ứng dụng từ nguồn bạn tin tưởng.</div></footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const size=b=>b>=1073741824?(b/1073741824).toFixed(1)+' GB':b>=1048576?(b/1048576).toFixed(b>=10485760?0:1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const ver=v=>/^\d/.test(v)?'v'+v:v;
const day=s=>new Date(/^\d{4}-\d{2}-\d{2}$/.test(s)?s+'T00:00':s).toLocaleDateString('vi-VN');
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  dl:svg('<path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/>'),
  back:svg('<path d="M15 5l-7 7 7 7"/>'),
  link:svg('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>')
};
let apps=[],cat='',sort='new',tt;
const pal=new Map();

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3600)}
const dl=a=>`href="${esc(a.apkUrl)}" download="${esc(a.name.replace(/[^\w.-]+/g,'_')+'-'+a.version+'.apk')}"`;
const ic=(a,c='')=>`<img class="ic ${c}" src="${esc(a.iconUrl)}" alt="" data-n="${esc(((a.name||'?').trim()[0]||'?').toUpperCase())}">`;

/* Lấy màu chủ đạo từ icon để tô màu banner */
function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=(mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4)*60}return[h,s,l]}
function palette(img){
  const n=32,cv=document.createElement('canvas');cv.width=cv.height=n;
  const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,n,n);
  let d;try{d=x.getImageData(0,0,n,n).data}catch{return null}
  const w=Array(12).fill(0),sum=w.map(()=>[0,0,0]);
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<128)continue;
    const[h,s,l]=hsl(d[i],d[i+1],d[i+2]);
    if(s<.2||l<.1||l>.92)continue;
    const k=Math.floor(h/30)%12,q=s*(1-Math.abs(2*l-1));
    w[k]+=q;sum[k][0]+=d[i]*q;sum[k][1]+=d[i+1]*q;sum[k][2]+=d[i+2]*q;
  }
  const k=w.indexOf(Math.max(...w));
  if(w[k]<8)return null;
  const[h,s]=hsl(sum[k][0]/w[k],sum[k][1]/w[k],sum[k][2]/w[k]);
  return{'--cd':`hsl(${Math.round(h)} ${Math.round(Math.min(Math.max(s,.4),.75)*100)}% 22%)`};
}
function tint(el){
  const id=el.dataset.tint,set=c=>c&&Object.entries(c).forEach(([k,v])=>el.style.setProperty(k,v));
  if(pal.has(id))return set(pal.get(id));
  const i=new Image();
  i.onload=()=>{const c=palette(i);pal.set(id,c);set(c)};
  i.src=el.dataset.icon;
}
const tintAll=()=>document.querySelectorAll('[data-tint]').forEach(el=>tint(el));

/* Điều hướng */
let ready;
const load=()=>ready||(ready=fetch('apps.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>Array.isArray(d)?d.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))):[]).catch(()=>{ready=null;toast('Không tải được danh sách ứng dụng. Tải lại trang để thử lại.');return[]}));
async function route(){
  const h=location.hash||'#/';
  document.body.dataset.r=h.startsWith('#/app/')?'app':'home';
  apps=await load();
  h.startsWith('#/app/')?detail(h.slice(6)):home();
  scrollTo(0,0);
}

/* Trang chủ */
const hero=a=>`<section class="hero" data-tint="${a.id}" data-icon="${esc(a.iconUrl)}">${ic(a,'hero-ic')}<div>
  <h1>${esc(a.name)}</h1><p class="dev">${esc(a.developer)}</p>
  ${a.description?`<p class="d">${esc(a.description.slice(0,200))}</p>`:''}
  <div class="acts"><a class="btn" ${dl(a)}>${I.dl}Tải APK <span class="num">${size(a.size)}</span></a><a class="btn alt" href="#/app/${a.id}">Xem chi tiết</a></div>
</div></section>`;
const row=a=>`<article class="row">${ic(a)}<div class="t"><b><a href="#/app/${a.id}">${esc(a.name)}</a></b><span class="s">${esc(a.developer)}</span><span class="s">${esc(a.category)}</span></div>
<div class="g"><a class="btn sm" ${dl(a)} aria-label="Tải APK ${esc(a.name)}">Tải</a><small class="num">${size(a.size)}</small></div></article>`;

function home(){
  document.title='AppHub';
  const m=$('#app');
  if(!apps.length){m.innerHTML=`<section class="empty"><h1>Chưa có ứng dụng nào</h1><p>Danh sách đang trống. Hãy quay lại sau nhé.</p></section>`;return}
  const raw=$('#q').value.trim(),q=raw.toLowerCase(),cats=[...new Set(apps.map(a=>a.category))];
  if(cat&&!cats.includes(cat))cat='';
  let list=apps.filter(a=>(!cat||a.category===cat)&&(!q||`${a.name} ${a.developer}`.toLowerCase().includes(q)));
  if(sort==='az')list=[...list].sort((a,b)=>a.name.localeCompare(b.name,'vi'));
  const chip=(c,n)=>`<button class="chip" aria-pressed="${cat===c}" data-cat="${esc(c)}">${esc(c||'Tất cả')}<small class="num">${n}</small></button>`;
  const title=q?`Kết quả cho “${esc(raw)}”`:cat?esc(cat):'Tất cả ứng dụng';
  m.innerHTML=`${!q&&!cat?hero(apps[0]):''}
<div class="chips">${chip('',apps.length)}${cats.map(c=>chip(c,apps.filter(a=>a.category===c).length)).join('')}</div>
<div class="sec"><h2>${title}</h2><div class="seg" role="group" aria-label="Sắp xếp"><button data-sort="new" aria-pressed="${sort==='new'}">Mới nhất</button><button data-sort="az" aria-pressed="${sort==='az'}">Tên A–Z</button></div></div>
${list.length?`<div class="list">${list.map(row).join('')}</div>`:`<p class="none">Không có ứng dụng nào khớp. Thử từ khóa khác hoặc chọn danh mục Tất cả.</p>`}`;
  tintAll();
}

/* Trang chi tiết */
function detail(id){
  const a=apps.find(x=>x.id===id),m=$('#app');
  if(!a){document.title='AppHub';m.innerHTML=`<section class="empty"><h1>Không tìm thấy ứng dụng</h1><p>Ứng dụng này có thể đã bị xóa.</p><a class="btn" href="#/">Xem tất cả ứng dụng</a></section>`;return}
  document.title=`${a.name} | AppHub`;
  const rel=apps.filter(x=>x.category===a.category&&x.id!==a.id).slice(0,12);
  m.innerHTML=`<a class="back" href="#/">${I.back}Tất cả ứng dụng</a>
<section class="dh" data-tint="${a.id}" data-icon="${esc(a.iconUrl)}">
  <div class="dh-top">${ic(a,'dh-ic')}<div>
    <h1>${esc(a.name)}</h1><p class="dev">${esc(a.developer)}</p>
    <div class="acts"><a class="btn" ${dl(a)}>${I.dl}Tải APK</a><button class="btn alt" id="cp" type="button">${I.link}Sao chép liên kết</button></div>
  </div></div>
  <div class="stats"><div><b>${esc(ver(a.version))}</b><span>Phiên bản</span></div><div><b class="num">${size(a.size)}</b><span>Dung lượng</span></div><div><b class="num">${a.updatedAt?day(a.updatedAt):'—'}</b><span>Cập nhật</span></div></div>
</section>
<div class="dbody">
  <div>
    ${a.description?`<h2>Giới thiệu</h2><p class="about">${esc(a.description)}</p>`:''}
    <h2 style="margin-top:${a.description?36:0}px">Cách cài đặt</h2>
    <ol class="steps"><li>Tải file APK về điện thoại Android.</li><li>Mở file trong mục Tải xuống rồi chọn Cài đặt.</li><li>Nếu máy chặn, bật “Cho phép từ nguồn này” trong cài đặt, sau đó quay lại bấm Cài đặt.</li></ol>
  </div>
  <aside><h2>Thông tin</h2><dl class="info">
    <div><dt>Nhà phát triển</dt><dd>${esc(a.developer)}</dd></div>
    <div><dt>Danh mục</dt><dd>${esc(a.category)}</dd></div>
    <div><dt>Định dạng</dt><dd>APK</dd></div>
  </dl></aside>
</div>
${rel.length?`<div class="sec"><h2>Cùng danh mục</h2></div><div class="tiles">${rel.map(r=>`<a class="tile" href="#/app/${r.id}">${ic(r)}<b>${esc(r.name)}</b><span>${size(r.size)}</span></a>`).join('')}</div>`:''}`;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Đã sao chép liên kết')}catch{toast('Không sao chép được. Hãy sao chép từ thanh địa chỉ.')}};
  tintAll();
}

/* Sự kiện chung */
$('#app').addEventListener('click',e=>{
  const c=e.target.closest('[data-cat]'),s=e.target.closest('[data-sort]');
  if(c){cat=c.dataset.cat;home();$(`[data-cat="${CSS.escape(cat)}"]`)?.focus()}
  else if(s){sort=s.dataset.sort;home();$(`[data-sort="${sort}"]`)?.focus()}
});
$('#q').addEventListener('input',()=>document.body.dataset.r==='home'?home():(location.hash='#/'));
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
addEventListener('error',e=>{
  const i=e.target;
  if(i&&i.tagName==='IMG'&&i.classList.contains('ic')){
    const p=document.createElement('span');p.className=i.className+' ph';p.textContent=i.dataset.n||'?';i.replaceWith(p);
  }
},true);
route();
</script>
