services:
  - type: web
    name: apphub-pop-ai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/apphub-data
      - key: ADMIN_PASSWORD
        sync: false
