name: Render keep-alive

on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.RENDER_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping Render health endpoint
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL }}
        run: |
          set -euo pipefail
          case "$BASE_URL" in
            https://*) ;;
            *) echo "RENDER_BASE_URL must start with https://"; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 20 "${BASE_URL%/}/health"
